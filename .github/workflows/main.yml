name: Android CI - OLX BSB

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # O projeto usa Gradle 5.1.1 + Android Gradle Plugin 3.4.2,
      # que só funcionam com Java 8 (não use 11 ou 17 aqui).
      - name: Configurar JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # O google-services.json NÃO está no repositório (contém dados do seu Firebase).
      # Salve o conteúdo dele em base64 no secret GOOGLE_SERVICES_JSON.
      - name: Criar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Rodar testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Gerar APK de debug
        run: ./gradlew assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: olx-bsb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
